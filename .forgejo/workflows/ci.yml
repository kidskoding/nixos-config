name: nix ci

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NIX_CONFIG: experimental-features = nix-command flakes
  CI_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
  CI_COMMIT_SHA: ${{ github.sha }}

jobs:
  check:
    runs-on: codeberg-medium
    timeout-minutes: 30
    container:
      image: ghcr.io/nixos/nix:2.35.2-amd64
    steps:
      - name: Check out commit
        run: |
          git init .
          git fetch --no-tags --depth=1 "$CI_REPOSITORY_URL" "$CI_COMMIT_SHA"
          git checkout --detach FETCH_HEAD
      - name: Check formatting
        run: |
          nix run --inputs-from . nixpkgs#alejandra -- --check .
          nix run --inputs-from . nixpkgs#taplo -- fmt --check
      - name: Check flake
        run: nix flake check


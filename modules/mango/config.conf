monitor_rule=name:eDP-1,x:0,y:0,scale:1.2

env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=SDL_VIDEODRIVER,wayland
env=CLUTTER_BACKEND,wayland
env=QT_AUTO_SCREEN_SCALE_FACTOR,0
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=GDK_SCALE,1
env=TERMINAL,ghostty

exec_once=noctalia
exec_once=nm-applet --indicator
exec_once=wl-paste --watch cliphist store
exec_once=ghostty

xkb_rules_layout=us
repeat_rate=25
repeat_delay=600
sloppy_focus=1
warp_cursor=0
cursor_theme=Adwaita
cursor_size=32

tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
mouse_natural_scrolling=0

border_radius=8
border_px=2
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=6
gap_outer_vertical=6
root_color=0x24273aff
border_color=0x1e2030ff
focus_color=0x8aadf4ff
urgent_color=0xed8796ff

shadows=1
shadows_size=20
shadows_blur=20
shadows_color=0x24273aee
blur=0
animations=1
animation_type_open=slide
animation_type_close=slide

scroller_default_proportion=0.5
scroller_default_proportion_single=1.0
scroller_ignore_proportion_single=0
scroller_proportion_preset=0.33333,0.5,0.66667,1.0
scroller_prefer_center=1

tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

bind=ALT,Return,spawn,ghostty
bind=ALT,e,spawn,nautilus --new-window
bind=ALT,d,spawn,noctalia msg panel-toggle launcher
bind=ALT,a,spawn,noctalia msg panel-toggle control-center home
bind=ALT,c,spawn,noctalia msg panel-toggle clipboard
bind=ALT+SHIFT,e,spawn,noctalia msg panel-toggle session
bind=ALT+CTRL,l,spawn,noctalia msg session lock
bind=ALT+SHIFT,c,spawn,hyprpicker -a
bind=ALT+SHIFT,r,reload_config

bind=ALT,q,killclient
bind=ALT,m,quit
bind=ALT,o,toggleoverview
bind=ALT,f,togglemaximizescreen
bind=ALT+SHIFT,f,togglefullscreen
bind=ALT+SHIFT,space,togglefloating
bind=ALT,r,switch_proportion_preset
bind=ALT,n,switch_layout
bind=ALT,t,setlayout,tile
bind=ALT,s,setlayout,scroller
bind=ALT,g,setlayout,grid
bind=ALT,comma,scroller_stack,left
bind=ALT,period,scroller_stack,right

bind=ALT,h,focusdir,left
bind=ALT,l,focusdir,right
bind=ALT,j,focusdir,down
bind=ALT,k,focusdir,up
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Down,focusdir,down
bind=ALT,Up,focusdir,up

bind=ALT+SHIFT,h,exchange_client,left
bind=ALT+SHIFT,l,exchange_client,right
bind=ALT+SHIFT,j,exchange_client,down
bind=ALT+SHIFT,k,exchange_client,up
bind=ALT+SHIFT,Left,exchange_client,left
bind=ALT+SHIFT,Right,exchange_client,right
bind=ALT+SHIFT,Down,exchange_client,down
bind=ALT+SHIFT,Up,exchange_client,up

bind=ALT,bracketleft,focusmon,left
bind=ALT,bracketright,focusmon,right
bind=ALT+SHIFT,bracketleft,tagmon,left
bind=ALT+SHIFT,bracketright,tagmon,right
bind=ALT,p,spawn_shell,pkill -x wl-mirror || wl-mirror --fullscreen-output HDMI-A-1 eDP-1

bind=ALT,1,view,1,0
bind=ALT,2,view,2,0
bind=ALT,3,view,3,0
bind=ALT,4,view,4,0
bind=ALT,5,view,5,0
bind=ALT,6,view,6,0
bind=ALT,7,view,7,0
bind=ALT,8,view,8,0
bind=ALT,9,view,9,0

bind=ALT+SHIFT,1,tag,1,0
bind=ALT+SHIFT,2,tag,2,0
bind=ALT+SHIFT,3,tag,3,0
bind=ALT+SHIFT,4,tag,4,0
bind=ALT+SHIFT,5,tag,5,0
bind=ALT+SHIFT,6,tag,6,0
bind=ALT+SHIFT,7,tag,7,0
bind=ALT+SHIFT,8,tag,8,0
bind=ALT+SHIFT,9,tag,9,0

bind=ALT+CTRL,1,tagsilent,1
bind=ALT+CTRL,2,tagsilent,2
bind=ALT+CTRL,3,tagsilent,3
bind=ALT+CTRL,4,tagsilent,4
bind=ALT+CTRL,5,tagsilent,5
bind=ALT+CTRL,6,tagsilent,6
bind=ALT+CTRL,7,tagsilent,7
bind=ALT+CTRL,8,tagsilent,8
bind=ALT+CTRL,9,tagsilent,9

bind=NONE,Print,spawn_shell,grim ~/Pictures/Screenshots/$(date +%Y-%m-%dT%H:%M:%S).png
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | wl-copy

bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize

gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,4,toggleoverview

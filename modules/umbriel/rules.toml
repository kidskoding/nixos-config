[[window_rule]]
match.is_focused = false
opacity = 0.95

[[window_rule]]
match.app_id = "^discord$"
default_maximize = true

[[window_rule]]
match.app_id = "^steam$"
match.title = "^notificationtoasts_[0-9]+_desktop$"
default_position = {x = 10, y = 10, anchor = "bottom_right"}

[[window_rule]]
match.app_id = ["^steam_app_.*$", "^gamescope$"]
default_fullscreen = true

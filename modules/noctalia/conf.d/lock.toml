[idle]
behavior_order = ["lock", "screen-off", "suspend"]

[idle.behavior.lock]
enabled = true
timeout = 300
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 330
action = "screen_off"

[idle.behavior.suspend]
enabled = true
timeout = 900
action = "lock_and_suspend"

[lockscreen]
transition = ["honeycomb"]
transition_duration = 800
blur_intensity = 0.6
tint_intensity = 0.35

[lockscreen_widgets]
enabled = true
widget_order = [
  "lockscreen-clock@eDP-1",
  "lockscreen-date@eDP-1",
  "lockscreen-login-box@eDP-1",
  "lockscreen-visualizer@eDP-1",
]

[lockscreen_widgets.widget."lockscreen-clock@eDP-1"]
type = "clock"
output = "eDP-1"
cx = 960.0
cy = 250.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 640.0
box_height = 200.0

[lockscreen_widgets.widget."lockscreen-clock@eDP-1".settings]
format = "{:%-I:%M %p}"
center_text = true
color = "on_surface"
background = false

[lockscreen_widgets.widget."lockscreen-date@eDP-1"]
type = "clock"
output = "eDP-1"
cx = 960.0
cy = 370.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 560.0
box_height = 56.0

[lockscreen_widgets.widget."lockscreen-date@eDP-1".settings]
format = "{:%A, %B %-d}"
center_text = true
color = "on_surface_variant"
background = false

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"
output = "eDP-1"
cx = 960.0
cy = 690.0
placement_width = 1920.0
placement_height = 1080.0

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
layout = "regular"
show_media = true
show_weather = true
show_session_buttons = true
show_battery = true
background_opacity = 0.6
background_radius = 16
input_radius = 12
show_unlock_hint = false
center_password_text = true
show_caps_lock = true
show_keyboard_layout = true

[lockscreen_widgets.widget."lockscreen-visualizer@eDP-1"]
type = "audio_visualizer"
output = "eDP-1"
cx = 960.0
cy = 990.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 600.0
box_height = 100.0

[lockscreen_widgets.widget."lockscreen-visualizer@eDP-1".settings]
show_when_idle = false
background = false

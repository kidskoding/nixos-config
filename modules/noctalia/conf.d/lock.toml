[idle]
behavior_order = ["lock", "screen-off", "suspend"]

[idle.behavior.lock]
enabled = true
timeout = 300
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 330
action = "screen_off"

[idle.behavior.suspend]
enabled = true
timeout = 900
action = "lock_and_suspend"

[lockscreen]
transition = ["honeycomb"]
transition_duration = 800
blur_intensity = 0.35
tint_intensity = 0.4

[lockscreen_widgets]
enabled = true
widget_order = [
  "lockscreen-clock@eDP-1",
  "lockscreen-date@eDP-1",
  "lockscreen-weather@eDP-1",
  "lockscreen-login-box@eDP-1",
  "lockscreen-media@eDP-1",
]

[lockscreen_widgets.widget."lockscreen-clock@eDP-1"]
type = "clock"
output = "eDP-1"
cx = 960.0
cy = 250.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 640.0
box_height = 200.0

[lockscreen_widgets.widget."lockscreen-clock@eDP-1".settings]
format = "{:%-I:%M %p}"
center_text = true
color = "on_surface"
background = false

[lockscreen_widgets.widget."lockscreen-date@eDP-1"]
type = "clock"
output = "eDP-1"
cx = 960.0
cy = 370.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 560.0
box_height = 56.0

[lockscreen_widgets.widget."lockscreen-date@eDP-1".settings]
format = "{:%A, %B %-d}"
center_text = true
color = "on_surface_variant"
background = false

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"
output = "eDP-1"
cx = 960.0
cy = 640.0
placement_width = 1920.0
placement_height = 1080.0

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
layout = "regular"
show_media = false
show_weather = false
show_session_buttons = true
show_clock = true
show_time = false
show_battery = true
show_user = true
show_wifi = true
show_notifications = false
background_opacity = 0.6
background_radius = 16
input_radius = 12
show_unlock_hint = false
center_password_text = true
show_caps_lock = true
show_keyboard_layout = true

[lockscreen_widgets.widget."lockscreen-media@eDP-1"]
type = "media_player"
output = "eDP-1"
cx = 960.0
cy = 870.0
placement_width = 1920.0
placement_height = 1080.0

[lockscreen_widgets.widget."lockscreen-media@eDP-1".settings]
background_opacity = 0.6
background_radius = 16
hide_when_no_media = true
show_progress = true

[lockscreen_widgets.widget."lockscreen-weather@eDP-1"]
type = "weather"
output = "eDP-1"
cx = 960.0
cy = 435.0
placement_width = 1920.0
placement_height = 1080.0

[lockscreen_widgets.widget."lockscreen-weather@eDP-1".settings]
show_forecast = false
background = false
